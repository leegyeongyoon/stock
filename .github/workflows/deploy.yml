name: Deploy Stock Trading to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  APP_NAME: stock-trading
  ECS_CLUSTER: honbabnono-cluster
  BACKEND_ECR: 975050251584.dkr.ecr.ap-northeast-2.amazonaws.com/stock-trading-backend
  FRONTEND_ECR: 975050251584.dkr.ecr.ap-northeast-2.amazonaws.com/stock-trading-frontend

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Backend image
        run: |
          docker build -t ${{ env.APP_NAME }}-backend -f Dockerfile .
          docker tag ${{ env.APP_NAME }}-backend:latest ${{ env.BACKEND_ECR }}:latest
          docker tag ${{ env.APP_NAME }}-backend:latest ${{ env.BACKEND_ECR }}:${{ github.sha }}
          docker push ${{ env.BACKEND_ECR }}:latest
          docker push ${{ env.BACKEND_ECR }}:${{ github.sha }}

      - name: Update Backend ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.APP_NAME }}-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Frontend image
        run: |
          docker build -t ${{ env.APP_NAME }}-frontend -f frontend/Dockerfile.prod frontend/
          docker tag ${{ env.APP_NAME }}-frontend:latest ${{ env.FRONTEND_ECR }}:latest
          docker tag ${{ env.APP_NAME }}-frontend:latest ${{ env.FRONTEND_ECR }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_ECR }}:latest
          docker push ${{ env.FRONTEND_ECR }}:${{ github.sha }}

      - name: Update Frontend ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.APP_NAME }}-frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

  wait-for-deployment:
    name: Wait for Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Backend to stabilize
        run: |
          echo "Waiting for backend service to stabilize..."
          timeout 600 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.APP_NAME }}-backend-service \
            --region ${{ env.AWS_REGION }} || echo "Backend stabilization timeout"

      - name: Wait for Frontend to stabilize
        run: |
          echo "Waiting for frontend service to stabilize..."
          timeout 600 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.APP_NAME }}-frontend-service \
            --region ${{ env.AWS_REGION }} || echo "Frontend stabilization timeout"

      - name: Deployment success
        run: |
          echo "🎉 Deployment completed!"
          echo "📊 Dashboard: https://stock.honbabnono.com"
          echo "🔌 API: https://stock-api.honbabnono.com"
          echo "📚 API Docs: https://stock-api.honbabnono.com/docs"
